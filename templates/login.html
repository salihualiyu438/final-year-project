<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surveillance System — Login</title>
<style>
:root{--bg:#07101d;--panel:#0d1828;--line:#213149;--text:#edf4ff;--muted:#91a2b9;--blue:#38bdf8;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#07101d,#091523);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.card{width:min(420px,calc(100% - 28px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 60px #0008}.brand{font-size:21px;font-weight:850}.sub{margin:5px 0 24px;color:var(--muted);font-size:13px}label{display:block;font-size:13px;margin:14px 0 7px}input,button{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);font:inherit}input{background:#091523;color:var(--text)}button{margin-top:18px;background:#15324c;color:var(--text);cursor:pointer}button:hover{background:#1b4566}.error{display:none;margin-top:12px;padding:10px;border-radius:9px;background:#40171b;color:#ffadb2;font-size:13px}.hint{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.5}
</style></head>
<body><main class="card"><div class="brand">PERIMETER SECURITY</div><div class="sub">Secure access portal</div>
<form id="form"><label>Username</label><input id="username" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button><div id="error" class="error"></div></form>
<div class="hint">Use your assigned owner or operator account. Authentication is required before the dashboard, video feed, evidence and APIs can be accessed.</div></main>
<script>
const form=document.getElementById('form'),err=document.getElementById('error');
form.onsubmit=async e=>{e.preventDefault();err.style.display='none';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok){err.textContent=d.error||'Login failed';err.style.display='block';return}location.href=d.user.role==='owner'?'/owner':'/';};
</script></body></html>
